<head>
<meta charset="utf-8">

<title>500 mots du Coran</title>

<style>
@font-face{font-family:"Amiri Quran";src:url(fonts/amiri-quran.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Alegreya";src:url(fonts/alegreya.woff2) format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url(fonts/alegreya-sans-regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url(fonts/alegreya-sans-medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Alegreya Sans";src:url(fonts/alegreya-sans-bold.woff2) format("woff2");font-weight:600 700;font-display:swap}
[hidden]{display:none!important} img{max-width:100%} html,body{margin:0}
</style>

<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: one-column phone app, bottom tab bar; session = full-screen focus mode with one card and three answers */
:root{
  --paper:#F3F5F9; --card:#FFFFFF; --ink:#16203A; --ink-2:#56627E; --line:#DDE2EC; --line-2:#EBEEF4;
  --lapis:#23409C; --lapis-soft:#E4E9F7; --on-lapis:#FFFFFF;
  --gold:#A97B22; --gold-soft:#F6EDDA;
  --ok:#1F7A55; --ok-soft:#DCF0E5; --bad:#B03A2A; --bad-soft:#F8E2DE;
  --shadow:0 1px 2px rgba(22,32,58,.06),0 6px 18px rgba(22,32,58,.06);
  --f-ar:"Amiri Quran","Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1424; --card:#161F35; --ink:#E8ECF4; --ink-2:#9BA7C2; --line:#2A3550; --line-2:#1F2942;
  --lapis:#93AAF6; --lapis-soft:#1E2B50; --on-lapis:#0E1424;
  --gold:#E2B85E; --gold-soft:#3A3120;
  --ok:#62C99A; --ok-soft:#163A2B; --bad:#F2907E; --bad-soft:#45231E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1424; --card:#161F35; --ink:#E8ECF4; --ink-2:#9BA7C2; --line:#2A3550; --line-2:#1F2942;
  --lapis:#93AAF6; --lapis-soft:#1E2B50; --on-lapis:#0E1424;
  --gold:#E2B85E; --gold-soft:#3A3120;
  --ok:#62C99A; --ok-soft:#163A2B; --bad:#F2907E; --bad-soft:#45231E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;font-feature-settings:normal}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.65rem;line-height:1.15}
h2{font-size:1.25rem}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.muted{color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{appearance:none;border:0;border-radius:12px;padding:14px 18px;font-weight:600;font-size:1.02rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn-primary{background:var(--lapis);color:var(--on-lapis)}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-quiet{background:var(--lapis-soft);color:var(--lapis)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.btn-block{width:100%}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--line-2);color:var(--ink-2);font-weight:600;white-space:nowrap}
.chip.lapis{background:var(--lapis-soft);color:var(--lapis)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}

/* header */
.top{display:flex;align-items:flex-end;gap:12px;margin-bottom:6px}
.top .ar-mark{font-family:var(--f-ar);font-size:2.1rem;line-height:1;color:var(--gold)}

/* coverage */
.cover-big{font-family:var(--f-display);font-size:3.1rem;line-height:1;font-weight:700;letter-spacing:-.02em}
.cover-big small{font-size:1.4rem;font-weight:600;margin-left:2px}
.strip-box{position:relative}
canvas.strip{display:block;width:100%;height:58px;border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* today */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--ink-2)}
.install{background:var(--gold-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:.95rem}
.install b{color:var(--gold)}

/* next words */
.next-list{display:flex;flex-direction:column}
.next-list .w{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line-2)}
.next-list .w:first-child{border-top:0}
.w .rank{width:2.4rem;font-size:.8rem;color:var(--ink-2)}
.w .wa{font-family:var(--f-ar);font-size:1.5rem;line-height:1.6;direction:rtl;min-width:4.5rem;text-align:right}
.w .wf{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
.tabs .in{display:flex;width:100%;max-width:560px}
.tab{flex:1;appearance:none;background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--ink-2);cursor:pointer;font-weight:600}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--lapis)}

/* words list */
.search{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap;color:var(--ink-2);font-weight:600}
.filters button[aria-pressed="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--on-lapis)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list .w{padding:6px 14px;border-top:1px solid var(--line-2);cursor:pointer;width:100%;appearance:none;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;display:flex;align-items:center;gap:12px}
.list .w:first-child{border-top:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.s1{background:var(--gold)}
.dot.s2{background:var(--lapis)}
.dot.s3{background:var(--ok)}
.w .wn{font-size:.78rem;color:var(--ink-2)}

/* session */
.session{min-height:100%;display:flex;flex-direction:column}
.sbar{display:flex;align-items:center;gap:12px;padding-block:12px 6px}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prog{flex:1;height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--lapis);border-radius:99px;transition:width .3s ease}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.card .meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.big-ar{font-family:var(--f-ar);direction:rtl;font-size:clamp(3.2rem,15vw,4.6rem);line-height:1.75;margin:4px 0 -4px;color:var(--ink)}
.big-fr{font-family:var(--f-display);font-size:clamp(1.7rem,7vw,2.2rem);line-height:1.2;margin:18px 0 10px;font-weight:600}
.prompt{font-size:.92rem;color:var(--ink-2)}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choice{appearance:none;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.08rem;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:56px;transition:background .15s,border-color .15s;color:var(--ink)}
.choice .k{width:26px;height:26px;border-radius:8px;background:var(--line-2);color:var(--ink-2);font-size:.8rem;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:700}
.choice.arc{justify-content:space-between}
.choice.arc .txt{font-family:var(--f-ar);font-size:1.9rem;line-height:1.6;direction:rtl}
.choice:not([disabled]):active{transform:scale(.99)}
.choice.right{background:var(--ok-soft);border-color:var(--ok)}
.choice.right .k{background:var(--ok);color:var(--card)}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad)}
.choice.wrong .k{background:var(--bad);color:var(--card)}
.choice[disabled]{cursor:default}
.choice.dim{opacity:.55}
.speak{appearance:none;border:0;background:var(--lapis-soft);color:var(--lapis);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.speak svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feedback{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.verdict{font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.detail{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kv .k{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600;min-width:5.5rem}
.forms{display:flex;flex-wrap:wrap;gap:6px 14px;direction:rtl;font-family:var(--f-ar);font-size:1.45rem;line-height:1.7}
.verse{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:1.45rem;line-height:2.15;background:var(--paper);border-radius:12px;padding:10px 14px}
.verse mark{background:var(--gold-soft);color:var(--ink);border-radius:6px;padding:0 3px;box-shadow:inset 0 -2px 0 var(--gold)}
.vref{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.86rem;color:var(--ink-2)}
.vref a{color:var(--lapis);font-weight:600;text-decoration:none}
.note{font-size:.95rem;color:var(--ink-2);background:var(--line-2);border-radius:10px;padding:8px 12px}
.note .ar{font-size:1.15rem;color:var(--ink)}
.dock{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--paper) 30%)}
.hint{font-size:.8rem;color:var(--ink-2);text-align:center}

/* stats */
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;background:var(--lapis);border-radius:4px 4px 1px 1px;min-height:2px}
.bars .b i.zero{background:var(--line)}
.bars .b span{font-size:.66rem;color:var(--ink-2)}
.bars .b em{font-style:normal;font-size:.66rem;color:var(--ink-2)}
.bars.gold .b i{background:var(--gold)}

/* settings */
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-2)}
.set:first-child{border-top:0}
.set label{flex:1;min-width:0}
.set small{display:block;color:var(--ink-2);font-size:.84rem}
.seg{display:flex;background:var(--line-2);border-radius:10px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.switch{appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;border:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch:checked{background:var(--lapis)}
.switch:checked::after{transform:translateX(20px)}
textarea{width:100%;min-height:110px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,28,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;font-size:.92rem;max-width:90%}
.pop{animation:pop .25s ease}
@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

/* ---------- spaced repetition (SM-2, auto-graded by answer speed) ---------- */
function card(id) { return S.cards[id] || null; }
function status(id) { const c = card(id); if (!c) return 0; if (c.s === 2) return c.ivl >= 21 ? 3 : 2; return 1; }

  bumpDay("new");
}
function markKnown(id) {

  Object.assign(c, {s: 2, step: 0, ef: 2.6, ivl: 15, due: t + 15, known: true});
  S.cards[id] = c; save();
}
function grade(id, correct, ms) {
  const t = dayNum(), c = S.cards[id];
  c.seen = (c.seen || 0) + 1; c.last = t;
  bumpDay(correct ? "ok" : "ko");
  if (c.s === 2) {
    if (correct) {
      if (ms > 6000) { c.ef = Math.max(1.3, c.ef - 0.15); c.ivl = Math.max(c.ivl + 1, Math.round(c.ivl * 1.2)); }
      else { c.ef = Math.min(3.0, c.ef + 0.05); c.ivl = Math.max(c.ivl + 1, Math.round(c.ivl * c.ef)); }
      if (c.ivl > 4) c.ivl = Math.round(c.ivl * (0.95 + Math.random() * 0.1));
      c.ivl = Math.min(c.ivl, 365); c.due = t + c.ivl; c.reps++;
      return "done";
    }
    c.lapses++; c.ef = Math.max(1.3, c.ef - 0.2); c.s = 1; c.step = 0; c.ivl = 0; c.due = t;
    return "soon";
  }
  if (correct) {
    if (c.step >= 1) { c.s = 2; c.ivl = 1; c.due = t + 1; c.reps++; return "done"; }
    c.step = 1; c.due = t; return "later";

}
function bumpDay(k) {

}

  const today = S.days[dayKey(t)] || {new: 0};
  const unseen = W.filter(w => !S.cards[w.id]).length;
  const fresh = Math.max(0, Math.min(S.settings.newPerDay - (today.new || 0), unseen));

  if (!has(t)) t--;

}

}

function drawStrip() {
  const cv = $("#strip"); if (!cv) return;
  const css = getComputedStyle(document.documentElement);
  const col = n => css.getPropertyValue(n).trim();
  const dpr = window.devicePixelRatio || 1, Wd = cv.clientWidth, H = cv.clientHeight;
  if (!Wd) return;
  cv.width = Math.round(Wd * dpr); cv.height = Math.round(H * dpr);
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  g.fillStyle = col("--line-2"); g.fillRect(0, 0, Wd, H);
  const C = [col("--line"), col("--gold"), col("--lapis"), col("--lapis")];
  let x = 0;
  for (const w of W) {
    const wd = w.n / DATA.total * Wd, s = status(w.id);
    const h = s ? H : H * 0.62;
    g.fillStyle = C[s]; g.fillRect(x, H - h, Math.max(wd, 0.35), h);
    x += wd;
  }
  // hatch for the words outside the 500
  g.save(); g.beginPath(); g.rect(x + 1, 0, Wd - x - 1, H); g.clip();
  g.strokeStyle = col("--line"); g.lineWidth = 1;
  for (let i = -H; i < Wd; i += 6) { g.beginPath(); g.moveTo(i, H); g.lineTo(i + H, 0); g.stroke(); }
  g.restore();
  // separators between the first words
  g.fillStyle = col("--card"); x = 0;
  for (const w of W) { const wd = w.n / DATA.total * Wd; x += wd; if (wd > 3) g.fillRect(x - 0.5, 0, 1, H); }
}

  const f = (id, l) => `<button type="button" data-filter="${id}" aria-pressed="${wf === id}">${l}</button>`;
  return `<div class="stack">
    <div><div class="eyebrow">Classés par fréquence</div><h1>Les 500 mots</h1></div>
    <input class="search" id="wsearch" type="search" placeholder="Chercher en français ou en arabe" value="${esc(wq)}" autocomplete="off">
    <div class="filters">${f("all", "Tous")}${f("0", "À découvrir")}${f("1", "En cours")}${f("2", "Appris")}${f("3", "Maîtrisés")}</div>
    <div class="list" id="wlist">${wordRows()}</div>
  </div>`;
}
function norm(s) { return String(s).normalize("NFD").replace(/[̀-ًͯ-ٰٟۖ-ۭـ]/g, "").replace(/[أإآٱ]/g, "ا").toLowerCase(); }
function wordRows() {
  const q = norm(wq.trim());
  const rows = W.filter(w => (wf === "all" || String(status(w.id)) === wf) && (!q || norm(w.fr).includes(q) || norm(w.ar).includes(q) || norm(w.forms.join(" ")).includes(q)));
  if (!rows.length) return `<div style="padding:16px" class="muted">Aucun mot ne correspond.</div>`;
  return rows.map(w => { const s = status(w.id); return `<button class="w" type="button" data-word="${w.id}"><span class="dot s${s}"></span><span class="rank num">${w.id}</span><span class="wf">${esc(w.fr)}<br><span class="wn num">${fmtN(w.n)}× · ${esc(w.cat)}</span></span><span class="wa">${esc(w.ar)}</span></button>`; }).join("");
}
function bindWords() {
  const inp = $("#wsearch");
  if (inp) inp.addEventListener("input", () => { wq = inp.value; $("#wlist").innerHTML = wordRows(); });
}
function sheetHTML() {
  const w = BY.get(sheet); const s = status(w.id);
  const st = ["À découvrir", "En cours", "Appris", "Maîtrisé"][s];
  const c = card(w.id);
  const due = c && c.s === 2 ? (c.due - dayNum() <= 0 ? "à réviser aujourd'hui" : `prochaine révision dans ${c.due - dayNum()} j`) : "";
  return `<div class="sheet-bg" data-act="close-sheet"><div class="sheet stack" role="dialog" aria-modal="true" aria-label="Détail du mot">
    <div class="row"><span class="chip ${s >= 2 ? "lapis" : s ? "gold" : ""}">${st}</span>${due ? `<span class="muted" style="font-size:.85rem">${due}</span>` : ""}<span class="spacer"></span><button class="iconbtn" type="button" data-act="close-sheet" aria-label="Fermer">${ICON.close}</button></div>
    <div class="card" style="box-shadow:none">${metaChips(w)}<div class="big-ar">${esc(w.ar)}</div>${speakBtn(w.ar)}<div class="big-fr" style="margin:10px 0 0">${esc(w.fr)}</div></div>
    ${detailHTML(w, {showFr: false})}
    ${s < 2 ? `<button class="btn btn-quiet btn-block" type="button" data-known="${w.id}">Je le connais déjà</button>` : ""}
  </div></div>`;
}

/* stats */
function viewStats() {
  const k = [0, 0, 0, 0]; for (const w of W) k[status(w.id)]++;
  const t = dayNum();
  const hist = []; for (let i = 13; i >= 0; i--) { const d = S.days[dayKey(t - i)] || {}; hist.push({d: t - i, n: (d.ok || 0) + (d.ko || 0), ok: d.ok || 0}); }
  const maxH = Math.max(10, ...hist.map(h => h.n));
  const fc = []; for (let i = 1; i <= 7; i++) { let n = 0; for (const id in S.cards) { const c = S.cards[id]; if (c.s === 2 && c.due === t + i) n++; } fc.push({d: t + i, n}); }
  const maxF = Math.max(5, ...fc.map(f => f.n));
  let ok = 0, all = 0; for (const key in S.days) { ok += S.days[key].ok || 0; all += (S.days[key].ok || 0) + (S.days[key].ko || 0); }
  const dl = n => new Date(n * 86400000).toLocaleDateString("fr-FR", {weekday: "narrow", timeZone: "UTC"});
  const bar = (n, max, lbl) => `<div class="b"><em class="num">${n || ""}</em><i class="${n ? "" : "zero"}" style="height:${Math.max(2, n / max * 60)}%"></i><span>${lbl}</span></div>`;
  return `<div class="stack">
    <div><div class="eyebrow">Ta progression</div><h1>Progrès</h1></div>
    <section class="panel stack">
      <div class="row" style="align-items:flex-end"><div><div class="eyebrow">Couverture du texte</div><div class="cover-big num">${fmtPct(coverage(2))}<small>%</small></div></div><span class="spacer"></span><div class="muted num" style="text-align:right;font-size:.9rem">dont ${fmtPct(coverage(3))} % maîtrisés<br>objectif : ${fmtPct(DATA.coverage)} %</div></div>
      <div class="grid4">
        <div class="stat"><b class="num">${k[0]}</b><span>à découvrir</span></div>
        <div class="stat"><b class="num">${k[1]}</b><span>en cours</span></div>
        <div class="stat"><b class="num">${k[2]}</b><span>appris (révision &lt; 3 sem.)</span></div>
        <div class="stat"><b class="num">${k[3]}</b><span>maîtrisés (≥ 3 sem.)</span></div>
      </div>
    </section>
    <section class="panel stack"><div class="row"><h2>14 derniers jours</h2><span class="spacer"></span><span class="muted num" style="font-size:.85rem">${all ? Math.round(ok / all * 100) + " % de bonnes réponses" : "pas encore de réponses"}</span></div>
      <div class="bars">${hist.map(h => bar(h.n, maxH, dl(h.d))).join("")}</div></section>
    <section class="panel stack"><div class="row"><h2>Révisions à venir</h2><span class="spacer"></span><span class="muted" style="font-size:.85rem">7 prochains jours</span></div>
      <div class="bars gold">${fc.map(f => bar(f.n, maxF, dl(f.d))).join("")}</div></section>
    <p class="muted" style="font-size:.88rem;margin:0">Un mot raté revient dans la même séance, puis le lendemain. Un mot réussi revient de plus en plus tard : 1 jour, 3 jours, 1 semaine, 3 semaines… Si tu réponds juste mais lentement (plus de 6 secondes), l'écart grandit moins vite.</p>
  </div>`;
}

/* settings */
let resetArmed = false, exportOpen = false, importMsg = "";
function viewSettings() {
  const st = S.settings;
  const seg = (vals, cur, key) => `<div class="seg" role="group">${vals.map(v => `<button type="button" data-set="${key}" data-val="${v}" aria-pressed="${cur === v}">${v}</button>`).join("")}</div>`;
  const sw = (key, label, help) => `<div class="set"><label for="sw-${key}">${label}<small>${help}</small></label><input class="switch" type="checkbox" id="sw-${key}" data-switch="${key}" ${st[key] ? "checked" : ""}></div>`;
  return `<div class="stack">
    <div><div class="eyebrow">Ton rythme</div><h1>Réglages</h1></div>
    <section class="panel">
      <div class="set"><label>Nouveaux mots par jour<small>Avec 10 par jour, les 500 mots sont vus en 50 jours.</small></label>${seg([5, 10, 20, 30], st.newPerDay, "newPerDay")}</div>
      ${sw("autoNext", "Passer seul après une bonne réponse", "Les erreurs restent affichées avec l'explication.")}
      ${sw("reverse", "Sens inverse", "Pour les mots déjà appris : le français s'affiche, tu choisis le mot arabe.")}
      ${canSpeak ? sw("autoSpeak", "Prononcer chaque mot", "Voix de synthèse de ton téléphone, prononciation approximative.") : ""}
    </section>
    <section class="panel stack">
      <h2>Sauvegarde</h2>
      <p class="muted" style="margin:0;font-size:.92rem">Ta progression est enregistrée sur cet appareil. Copie-la de temps en temps pour la garder ou la passer sur un autre téléphone.</p>
      <div class="row" style="flex-wrap:wrap"><button class="btn btn-ghost" type="button" data-act="export">Copier ma progression</button>${IS_PWA ? `<button class="btn btn-ghost" type="button" data-act="download">Télécharger le fichier</button>` : ""}</div>
      ${exportOpen ? `<textarea id="exp" readonly>${esc(JSON.stringify(S))}</textarea>` : ""}
      <label for="imp" class="muted" style="font-size:.92rem">Restaurer : colle une sauvegarde ici ou choisis un fichier.</label>
      <textarea id="imp" placeholder='{"cards":{…}}'></textarea>
      <div class="row" style="flex-wrap:wrap"><button class="btn btn-quiet" type="button" data-act="import">Restaurer</button><input type="file" id="impfile" accept="application/json,.json" style="max-width:100%;font-size:.85rem"></div>
      ${importMsg ? `<div class="note">${esc(importMsg)}</div>` : ""}
    </section>
    <section class="panel stack">
      <h2>Recommencer</h2>
      <button class="btn btn-danger" type="button" data-act="reset">${resetArmed ? "Confirmer : tout effacer" : "Remettre à zéro ma progression"}</button>
      ${resetArmed ? `<button class="btn btn-ghost" type="button" data-act="unreset">Annuler</button>` : ""}
    </section>
    <p class="muted" style="font-size:.84rem;margin:0">Fréquences calculées à partir du Quranic Arabic Corpus (morphologie mot par mot, 77 429 mots). Les préfixes (و، ف، بـ، الـ) et les pronoms suffixes comptent comme des mots, ce qui donne les ${fmtPct(DATA.coverage)} % de couverture. Police Amiri Quran (licence OFL).</p>
  </div>`;
}

/* ---------- session ---------- */
let Q = null; // {queue:[{id,type}], done, total, ok, ko, cur, answered, t0, startCov, newIds:Set}
function startSession(extra = 0) {
  const t = dayNum();
  const learning = [], reviews = [];
  for (const w of W) { const c = S.cards[w.id]; if (!c || c.due > t) continue; (c.s === 2 ? reviews : learning).push(w.id); }
  reviews.sort((a, b) => S.cards[a].due - S.cards[b].due || a - b);
  const nNew = extra || counts().fresh;
  const fresh = W.filter(w => !S.cards[w.id]).slice(0, nNew).map(w => w.id);
  const queue = learning.map(id => ({id, type: "quiz"}));
  let r = 0, f = 0;
  while (r < reviews.length || f < fresh.length) {
    for (let i = 0; i < 3 && r < reviews.length; i++) queue.push({id: reviews[r++], type: "quiz"});
    if (f < fresh.length) queue.push({id: fresh[f++], type: "intro"});
  }
  if (!queue.length) return;
  Q = {queue, done: 0, total: queue.length + fresh.length * 2, ok: 0, ko: 0, cur: null, answered: false, startCov: coverage(2), newIds: new Set(fresh)};
  view = "session"; nextCard();
}
function insertAt(item, pos) { Q.queue.splice(Math.min(pos, Q.queue.length), 0, item); }
function nextCard() {
  if (!Q.queue.length) { Q.cur = null; save(); renderSession(); return; }
  const item = Q.queue.shift();
  const w = BY.get(item.id);
  Q.cur = item; Q.answered = false; Q.picked = null;
  if (item.type === "quiz") {
    const c = S.cards[item.id];
    Q.reverse = S.settings.reverse && c && c.s === 2 && c.ivl >= 3 && Math.random() < 0.4;
    Q.opts = shuffle([w, ...distractors(w, Q.reverse)]);
  }
  Q.t0 = performance.now();
  renderSession();
  if (S.settings.autoSpeak && !(item.type === "quiz" && Q.reverse)) speak(w.ar);
}
function stems(fr) { return new Set(norm(fr).split(/[^a-zœ']+/).filter(t => t.length > 3).map(t => t.slice(0, 5))); }
function overlaps(a, b) { for (const t of a) if (b.has(t)) return true; return false; }
function distractors(w, reverse) {
  const ws = stems(w.fr);
  const pool = W.filter(o => o.id !== w.id && o.g === w.g && o.ar !== w.ar && o.fr !== w.fr && !overlaps(ws, stems(o.fr)));
  const near = shuffle(pool.map(o => ({o, d: Math.abs(o.id - w.id) + Math.random() * 60})).sort((a, b) => a.d - b.d).slice(0, 24).map(x => x.o));
  const out = [];
  for (const o of near) { if (out.length === 2) break; if (out.some(x => x.fr === o.fr || x.ar === o.ar || overlaps(stems(x.fr), stems(o.fr)))) continue; out.push(o); }
  return out;
}
function answer(i) {
  if (!Q || Q.answered) return;
  const w = BY.get(Q.cur.id), pick = Q.opts[i];
  const ms = performance.now() - Q.t0;
  const ok = pick.id === w.id;
  Q.answered = true; Q.picked = i; Q.lastOk = ok;
  ok ? Q.ok++ : Q.ko++;
  const res = grade(w.id, ok, ms);
  if (res === "soon") { insertAt({id: w.id, type: "quiz"}, 3); Q.total++; }
  else if (res === "later") insertAt({id: w.id, type: "quiz"}, 6);
  Q.done++;
  save();
  renderSession();
  if (ok && S.settings.autoNext) { clearTimeout(Q.timer); Q.timer = setTimeout(() => { if (Q && Q.answered && Q.cur && Q.cur.id === w.id) nextCard(); }, 900); }
}
function learned() {
  const w = BY.get(Q.cur.id);
  introduce(w.id); save();
  insertAt({id: w.id, type: "quiz"}, 3);
  Q.done++;
  nextCard();
}
function quitSession() { clearTimeout(Q && Q.timer); Q = null; view = "home"; save(); render(); }
function renderSession() {
  const app = $("#app");
  if (!Q) { view = "home"; return render(); }
  const pct = Math.min(100, Q.done / Math.max(1, Q.done + Q.queue.length) * 100);
  const bar = `<div class="sbar"><button class="iconbtn" type="button" data-act="quit" aria-label="Quitter la séance">${ICON.close}</button><div class="prog" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><span class="num muted" style="font-size:.9rem;min-width:3.2rem;text-align:right">${Q.queue.length + (Q.cur ? 1 : 0)} rest.</span></div>`;
  if (!Q.cur) { app.innerHTML = `<div class="wrap session">${bar}${endHTML()}</div>`; return; }
  const w = BY.get(Q.cur.id);
  let inner;
  if (Q.cur.type === "intro") {
    inner = `<div class="card pop"><span class="chip gold">Nouveau mot · nº ${w.id}</span>${metaChips(w)}<div class="big-ar">${esc(w.ar)}</div>${speakBtn(w.ar)}<div class="big-fr" style="margin:12px 0 4px">${esc(w.fr)}</div></div>
      <div class="panel" style="margin-top:12px">${detailHTML(w, {showFr: false})}</div>
      <div class="dock"><button class="btn btn-primary btn-block" type="button" data-act="learned">J'ai retenu, on continue</button><div class="hint" style="margin-top:6px">Ce mot reviendra en question dans quelques instants.</div></div>`;
  } else {
    const rev = Q.reverse;
    const head = rev
      ? `<div class="card pop"><div class="meta"><span class="chip lapis">Sens inverse</span><span class="chip">${esc(w.cat)}</span></div><div class="big-fr">${esc(w.fr)}</div><div class="prompt">Quel est le mot arabe ?</div></div>`
      : `<div class="card pop">${metaChips(w)}<div class="big-ar">${esc(w.ar)}</div>${speakBtn(w.ar)}<div class="prompt" style="margin-top:6px">Que signifie ce mot ?</div></div>`;
    const ch = Q.opts.map((o, i) => {
      let cls = "choice" + (rev ? " arc" : "");
      if (Q.answered) { if (o.id === w.id) cls += " right"; else if (i === Q.picked) cls += " wrong"; else cls += " dim"; }
      const txt = rev ? `<span class="txt">${esc(o.ar)}</span>` : `<span class="txt">${esc(o.fr)}</span>`;
      return `<button class="${cls}" type="button" data-choice="${i}" ${Q.answered ? "disabled" : ""}><span class="k">${i + 1}</span>${txt}</button>`;
    }).join("");
    let fb = "";
    if (Q.answered) {
      const ok = Q.lastOk;
      const wrongPick = !ok ? Q.opts[Q.picked] : null;
      fb = `<div class="feedback pop">
        <div class="row"><div class="verdict ${ok ? "ok" : "bad"}">${ok ? "Juste" : "Pas tout à fait"}</div><span class="spacer"></span>${rev ? speakBtn(w.ar) : ""}</div>
        ${rev ? `<div class="big-ar" style="text-align:center;font-size:3rem;margin:0">${esc(w.ar)}</div>` : ""}
        ${wrongPick ? `<div class="note">Ta réponse, <span class="ar">${esc(wrongPick.ar)}</span>, signifie « ${esc(wrongPick.fr)} ».</div>` : ""}
        <div class="panel">${detailHTML(w)}</div>
      </div>
      <div class="dock"><button class="btn btn-primary btn-block" type="button" data-act="next" id="nextbtn">Continuer</button>${ok && S.settings.autoNext ? "" : `<div class="hint" style="margin-top:6px">Ce mot reviendra dans quelques cartes.</div>`}</div>`;
    }
    inner = `${head}<div class="choices">${ch}</div>${fb}`;
  }
  app.innerHTML = `<div class="wrap session" style="padding-bottom:16px">${bar}${inner}</div>`;
  if (Q.answered && !Q.lastOk) { const b = $("#nextbtn"); if (b) b.focus({preventScroll: true}); }
}
function endHTML() {
  const cov = coverage(2), gain = cov - Q.startCov, all = Q.ok + Q.ko;
  const c = counts();
  return `<div class="stack" style="margin-top:12px">
    <div class="card pop"><span class="chip ok">Séance terminée</span><div class="big-ar" style="font-size:2.4rem;margin:6px 0 0">بَارَكَ ٱللَّهُ فِيكَ</div><div class="muted">Qu'Allah te bénisse.</div></div>
    <div class="today">
      <div class="stat"><b class="num">${all}</b><span>réponses</span></div>
      <div class="stat"><b class="num">${all ? Math.round(Q.ok / all * 100) : 0} %</b><span>justes</span></div>
      <div class="stat"><b class="num">${Q.newIds.size}</b><span>nouveaux mots</span></div>
    </div>
    <div class="panel"><div class="eyebrow">Tu reconnais maintenant</div><div class="cover-big num">${fmtPct(cov)}<small>%</small></div><div class="muted num">${gain > 0.05 ? `+${fmtPct(gain)} point${gain >= 2 ? "s" : ""} pendant cette séance. ` : ""}Reviens demain : les mots d'aujourd'hui repasseront avant de s'espacer.</div></div>
    ${c.unseen ? `<button class="btn btn-quiet btn-block" type="button" data-act="extra">Apprendre 5 mots de plus</button>` : ""}
    <button class="btn btn-primary btn-block" type="button" data-act="quit">Retour à l'accueil</button>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-view],[data-choice],[data-word],[data-filter],[data-set],[data-speak],[data-recite],[data-known]");
  if (!el) return;
  if (el.dataset.speak !== undefined) { e.stopPropagation(); speak(el.dataset.speak); return; }
  if (el.dataset.recite) { recite(el.dataset.recite); return; }
  if (el.dataset.choice !== undefined) { answer(+el.dataset.choice); return; }
  if (el.dataset.view) { view = el.dataset.view; sheet = null; resetArmed = false; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.word) { sheet = +el.dataset.word; render(); return; }
  if (el.dataset.known) { markKnown(+el.dataset.known); toast("Marqué comme connu, révision dans 15 jours"); render(); return; }
  if (el.dataset.filter) { wf = el.dataset.filter; render(); return; }
  if (el.dataset.set) { S.settings[el.dataset.set] = +el.dataset.val; save(); render(); return; }
  const a = el.dataset.act;
  if (a === "close-sheet") { if (e.target === el || el.classList.contains("iconbtn")) { sheet = null; render(); } return; }
  if (a === "start") startSession();
  else if (a === "extra") startSession(5);
  else if (a === "quit") quitSession();
  else if (a === "next") { clearTimeout(Q.timer); nextCard(); }
  else if (a === "learned") learned();
  else if (a === "export") doExport();
  else if (a === "download") doDownload();
  else if (a === "import") doImport($("#imp").value);
  else if (a === "reset") { if (!resetArmed) { resetArmed = true; render(); } else { S = normalize({settings: S.settings}); save(); resetArmed = false; toast("Progression effacée"); render(); } }
  else if (a === "unreset") { resetArmed = false; render(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.switch) { S.settings[el.dataset.switch] = el.checked; save(); return; }
  if (el.id === "impfile" && el.files && el.files[0]) { const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(el.files[0]); }
});
document.addEventListener("keydown", e => {
  if (view !== "session" || !Q || !Q.cur) return;
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  if (Q.cur.type === "quiz" && !Q.answered && ["1", "2", "3"].includes(e.key)) { answer(+e.key - 1); e.preventDefault(); }
  else if (e.key === "Enter" || e.key === " ") {
    if (Q.cur.type === "intro") { learned(); e.preventDefault(); }
    else if (Q.answered) { clearTimeout(Q.timer); nextCard(); e.preventDefault(); }
  } else if (e.key === "Escape") quitSession();
});
let audio = null;
function recite(ref) {
  const [s, v] = ref.split(":");
  const url = `https://everyayah.com/data/Alafasy_128kbps/${String(s).padStart(3, "0")}${String(v).padStart(3, "0")}.mp3`;
  try { if (audio) audio.pause(); audio = new Audio(url); audio.play().catch(() => toast("Récitation indisponible hors connexion")); } catch (e) {}
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function doExport() {
  const raw = JSON.stringify(S);
  exportOpen = true; render();
  const ta = $("#exp");
  const fallback = () => { if (ta) { ta.focus(); ta.select(); } toast("Sélectionné : copie-le avec le menu"); };
  try { navigator.clipboard.writeText(raw).then(() => toast("Progression copiée"), fallback); } catch (e) { fallback(); }
}
function doDownload() {
  const blob = new Blob([JSON.stringify(S)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `500-mots-sauvegarde-${dayKey(dayNum())}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function doImport(raw) {
  try {
    const st = JSON.parse(raw);
    if (!st || typeof st.cards !== "object") throw new Error("format");
    S = normalize(st); save(); importMsg = `Sauvegarde restaurée : ${Object.keys(S.cards).length} mots suivis.`;
  } catch (e) { importMsg = "Ce texte n'est pas une sauvegarde valide. Colle tout le contenu copié depuis « Copier ma progression »."; }
  render();
}
window.addEventListener("resize", () => { if (view === "home") drawStrip(); });
if (window.matchMedia) { try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => view === "home" && drawStrip()); } catch (e) {} }
new MutationObserver(() => view === "home" && drawStrip()).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
document.fonts && document.fonts.ready.then(() => view === "home" && drawStrip());
render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
